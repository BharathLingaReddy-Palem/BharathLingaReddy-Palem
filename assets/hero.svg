  <text x="1136" y="453" fill="#9FAC93" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.8">MODEL</text>
  <text x="1278" y="453" fill="#D9FF8A" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.8">PRODUCT</text>
  <path d="M56 482H1384" stroke="#394235"/>
