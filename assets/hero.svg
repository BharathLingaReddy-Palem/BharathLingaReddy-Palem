  <text x="1166" y="60" fill="#C7CEC0" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.3">HYDERABAD / INDIA</text>
  <text x="56" y="151" fill="#B9C4AD" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3.2">THE BUILDER’S BRIEF / AI &amp; ML</text>
  <text x="45" y="279" fill="#F2F0E7" font-family="Arial, Helvetica, sans-serif" font-size="144" font-weight="800" letter-spacing="-8">BHARATH<tspan fill="#D9FF8A">.</tspan></text>
  <text x="53" y="354" fill="#F2F0E7" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600" letter-spacing="-2.3">AI systems. <tspan fill="#D9FF8A">Product thinking.</tspan></text>
  <text x="56" y="408" fill="#ADB7A5" font-family="Arial, Helvetica, sans-serif" font-size="19">Python / Machine Learning / RAG / MCP</text>
