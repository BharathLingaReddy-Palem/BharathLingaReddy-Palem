<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Bharath Linga Reddy Palem — AI systems. Product thinking.</title>
  <desc id="desc">An editorial introduction in ink, ivory, and acid green, with a sculptural path connecting data, models, and useful applications.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1440" y2="550" gradientUnits="userSpaceOnUse"><stop stop-color="#181C19"/><stop offset="1" stop-color="#0B100D"/></linearGradient>
    <linearGradient id="signal" x1="1030" y1="125" x2="1304" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#E3FFA8"/><stop offset=".5" stop-color="#A9CF69"/><stop offset="1" stop-color="#526F35"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#566149" opacity=".3"/></pattern>
  </defs>
  <style>.signal{stroke-dasharray:3 24;animation:flow 16s linear infinite}.live{animation:breathe 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-270}}@keyframes breathe{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.signal,.live{animation:none}}</style>
  <rect width="1440" height="550" rx="20" fill="url(#ink)"/>
  <rect x="968" y="82" width="414" height="376" fill="url(#dots)"/>
  <path d="M56 96H1384" stroke="#394235"/>
