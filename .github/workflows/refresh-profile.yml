name: Refresh public portfolio charts

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-charts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read public repository metadata and render charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit updated public charts
        run: |
          git add data/repositories.json assets/portfolio-signal.svg assets/portfolio-signal-light.svg
          if git diff --cached --quiet; then
            echo "Public portfolio data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public portfolio charts"
          git push
